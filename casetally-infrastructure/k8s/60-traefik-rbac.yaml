# RBAC for the Traefik ingress controller.
#
# These rules are copied verbatim from Traefik's own documentation at the exact
# version pinned in 61-traefik-deployment.yaml, not written from memory:
#
#   docs/content/reference/dynamic-configuration/kubernetes-crd-rbac.yml
#   at tag v3.3 in github.com/traefik/traefik
#
# One deliberate subtraction: the upstream file also grants get/list/watch on the
# traefik.io CRDs (middlewares, ingressroutes, traefikservices, tlsoptions and
# the rest). This deployment enables only the kubernetesingress provider, installs
# no CRDs, and never watches those resources, so granting access to them would be
# permission for something that cannot happen. Everything the Kubernetes Ingress
# provider actually reads is kept exactly as upstream has it.
#
# Why Ingress rather than Gateway API: see the note in 63-ingress.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
  namespace: casetally
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: casetally

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-ingress-controller
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: casetally
rules:
  # Services to resolve backends. Secrets for TLS certificates referenced by an
  # Ingress. Nodes so Traefik can resolve node addresses.
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
    verbs:
      - get
      - list
      - watch

  # EndpointSlices, not Endpoints: this is how Traefik v3 discovers the actual
  # pod addresses behind a Service.
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch

  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  # Needed to write the load balancer address back onto the Ingress, which is
  # what populates the ADDRESS column in `kubectl get ingress`.
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-ingress-controller
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: casetally
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-ingress-controller
subjects:
  - kind: ServiceAccount
    name: traefik-ingress-controller
    # Upstream's example says "default"; this cluster keeps everything in the
    # casetally namespace.
    namespace: casetally

# Traefik ingress controller.
#
# Why Traefik and not ingress-nginx: ingress-nginx was retired by the Kubernetes
# project with end of life in March 2026, so it receives no further releases or
# security fixes. Adopting it for new work would mean starting on a dead
# component. Traefik is also what CaseTally already runs in production
# (docker-compose.infra.prod.yml pins traefik:v2.10), so the two environments
# share a proxy rather than diverging.
#
# It also happens to be the better fit for this app: Traefik streams responses
# through without buffering by default, which is exactly what /v1/chat/stream
# needs. The nginx controller buffers responses unless told otherwise and needs
# an explicit proxy-buffering annotation per Ingress to stream SSE at all.
#
# Installed as plain manifests rather than via Helm, matching the project-wide
# decision that every object should be readable in the file that creates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: casetally
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: casetally
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The pod claims hostPort 80 and 443 on the node,
  # and two pods cannot bind the same host port, so a rolling update would leave
  # the new pod Pending forever while the old one held the ports.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/part-of: casetally
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/component: ingress
        app.kubernetes.io/part-of: casetally
    spec:
      serviceAccountName: traefik-ingress-controller

      # This is the label set on the kind node back in Step 1, finally used.
      # kind's extraPortMappings forward host 80/443 to the NODE's 80/443, so
      # whatever serves the ingress has to be listening on the node itself.
      nodeSelector:
        ingress-ready: "true"

      containers:
        - name: traefik
          # Pinned by digest. This is Traefik 3.3.7.
          image: traefik:v3.3@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f
          imagePullPolicy: IfNotPresent

          args:
            # Only the Kubernetes Ingress provider. No CRDs are installed and the
            # CRD provider is not enabled, which is why the ClusterRole omits the
            # traefik.io rules.
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik

            - --entryPoints.web.address=:80
            - --entryPoints.websecure.address=:443

            # Dedicated entrypoint for health checks, declared explicitly.
            #
            # /ping is NOT served on the web entrypoint. Traefik attaches it to
            # its internal "traefik" entrypoint, which defaults to :8080, so
            # probing port 80 for /ping returns 404 and the pod crash-loops on a
            # failing startup probe. Naming the entrypoint and binding ping to it
            # makes the relationship visible instead of depending on a default.
            #
            # This port gets no hostPort, so health checking stays internal to
            # the cluster rather than being exposed on the node alongside the app.
            - --entryPoints.health.address=:8080
            - --ping.entryPoint=health

            # SSE survival. /v1/chat/stream holds one HTTP response open and
            # writes tokens into it for as long as the model keeps generating.
            #
            # writeTimeout is the one that would kill it: it bounds how long
            # Traefik will spend writing a response, and any finite value becomes
            # a hard cap on stream length. 0 disables it.
            #
            # readTimeout bounds reading the request, which for SSE is a single
            # short POST, but a finite value here has been observed to cut
            # streamed responses on some setups, so it is also disabled.
            #
            # idleTimeout only applies to keep-alive connections with no active
            # request, so it can stay bounded.
            - --entryPoints.web.transport.respondingTimeouts.readTimeout=0
            - --entryPoints.web.transport.respondingTimeouts.writeTimeout=0
            - --entryPoints.web.transport.respondingTimeouts.idleTimeout=600s

            # Same reasoning on the backend side: do not give up waiting for the
            # API's first byte or for the body to finish.
            - --serversTransport.forwardingTimeouts.dialTimeout=30s
            - --serversTransport.forwardingTimeouts.responseHeaderTimeout=0
            - --serversTransport.forwardingTimeouts.idleConnTimeout=600s

            - --ping=true
            - --log.level=INFO
            - --accesslog=true
            # Dashboard off. It would need either exposure or a port-forward, and
            # an unauthenticated dashboard on a host port is not worth the
            # convenience.
            - --api.dashboard=false

          ports:
            - name: web
              containerPort: 80
              # hostPort binds the node's port directly, which is what kind's
              # extraPortMappings forward host 80/443 to.
              hostPort: 80
              protocol: TCP
            - name: websecure
              containerPort: 443
              hostPort: 443
              protocol: TCP
            # No hostPort: health checks stay inside the cluster.
            - name: health
              containerPort: 8080
              protocol: TCP

          # /ping on the dedicated health entrypoint. A real request through
          # Traefik's own router, not a TCP accept.
          startupProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            # Traefik is a proxy: it holds connections, not data. An early
            # measurement put memory.peak at 41 MiB, and 128Mi was set as ~3x
            # that.
            #
            # That measurement was taken too early. In steady state this pod sits
            # at 127 MiB against a 128 MiB ceiling, with memory.events recording
            # 144 reclaim events and zero headroom: the kernel was continuously
            # reclaiming to keep it under the limit. It had not been OOM killed
            # yet, but it is the single thing every request passes through, so it
            # is the worst pod in the namespace to leave one allocation away from
            # being killed. Raised to 256Mi, which the node has room for.
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # Binding ports below 1024 needs this. The alternative is running
              # as root, which is strictly worse: this grants exactly one
              # capability instead of all of them.
              add: ["NET_BIND_SERVICE"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

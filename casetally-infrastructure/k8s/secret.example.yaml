# DOCUMENTATION ONLY. This file is never applied.
#
# Two things keep an accidental `kubectl apply -f k8s/` from doing damage:
# it carries no numeric prefix, so it is visibly outside the ordered apply
# sequence, and its metadata.name is deliberately NOT the real Secret name.
# Applying it by mistake creates an unused object rather than overwriting live
# credentials with REPLACE_ME.
#
# It exists so the Secret's shape (name, namespace, exact key names) is
# reviewable in git without any real value ever being committed. The real
# Secret is created imperatively from a gitignored env file:
#
#   1. Create casetally-infrastructure/k8s/.env.k8s containing exactly the
#      three keys below. It is already ignored by
#      casetally-infrastructure/.gitignore (rule ".env.*"). Verified with
#      `git check-ignore -v casetally-infrastructure/k8s/.env.k8s`.
#
#        POSTGRES_PASSWORD=...
#        GROQ_API_KEY=...
#
#      Do NOT quote the values. kubectl's --from-env-file parser is not a
#      shell: it takes everything after the "=" literally, so FOO="bar" becomes
#      the six-character value "bar" WITH the quotes, and Postgres then
#      rejects the password. (# comments and blank lines ARE skipped.)
#
#   2. Apply it idempotently. Plain `kubectl create secret` fails on re-run
#      with AlreadyExists, so pipe a client-side render into apply:
#
#        kubectl create secret generic casetally-secrets \
#          --namespace casetally \
#          --from-env-file=casetally-infrastructure/k8s/.env.k8s \
#          --dry-run=client -o yaml | kubectl apply -f -
#
# Why --from-env-file rather than a real-valued secret.yaml on disk: no file
# containing a live credential ever exists inside the manifest tree, so the
# gitignore rule is a second line of defence rather than the only one.
#
# The REAL Secret is named casetally-secrets and is created by the command
# above, never from this file.
#
# DATABASE_URL is deliberately absent. It embeds the password, so it looks like
# a secret, but storing it here would mean the password lived in two places and
# could drift. The API pod spec assembles it instead, using Kubernetes $(VAR)
# interpolation over POSTGRES_PASSWORD, so there is exactly one source of truth.
# See 30-api-deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: casetally-secrets-example
  namespace: casetally
  labels:
    app.kubernetes.io/part-of: casetally
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  GROQ_API_KEY: "REPLACE_ME"

services:
  postgres:
    image: localhost:5000/casetally-db:latest
    container_name: casetally-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: casetally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: casetally_law
      PGDATA: /var/lib/postgresql/data/pgdata
      DATABASE_URL: postgresql://casetally:${POSTGRES_PASSWORD}@localhost:5432/casetally_law
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casetally-network
    # Remove ports if you only want internal access
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casetally"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: casetally-adminer
    restart: unless-stopped
    ports:
      - "5051:8080"
    networks:
      - casetally-network

volumes:
  postgres_data:
    name: casetally_postgres_data

networks:
  casetally-network:
    external: true
    name: casetally-network